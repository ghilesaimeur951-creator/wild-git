name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Installer le SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Vérifier la logique des séances
        run: |
          mkdir -p /tmp/sport-chrono-check
          javac -d /tmp/sport-chrono-check app/src/main/java/com/example/sportchrono/SessionEngine.java EngineCheck.java
          java -cp /tmp/sport-chrono-check EngineCheck
      - name: Compiler et vérifier
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SportChrono-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
