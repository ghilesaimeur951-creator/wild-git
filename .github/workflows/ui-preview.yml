name: Vérification visuelle Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler l’APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Capturer les écrans et le clavier
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          script: bash .github/scripts/preview-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Captures-SportChrono
          path: ui-captures/
          if-no-files-found: warn
