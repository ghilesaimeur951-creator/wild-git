plugins { id 'com.android.application' }

android {
    namespace 'com.example.sportchrono'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.sportchrono'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
